services:
  redis:
    image: redis:alpine
    container_name: file_conversion_redis
    restart: always

  web:
    build: .
    container_name: file_conversion_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: file_conversion_worker
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always